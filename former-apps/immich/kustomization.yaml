apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- immich-cm.yaml
- immich-deploy.yaml
- immich-ext-ing.yaml
- immich-local-ing.yaml
- immich-postgres-svc.yaml
- immich-postgres-sts.yaml
- immich-pvc.yaml
- immich-redis-deploy.yaml
- immich-redis-svc.yaml
- immich-secret.yaml
- immich-svc.yaml
patches:
- path: ../../overlays/ing-authentified.yaml
  target:
    kind: Ingress
    labelSelector: authentified
- path: ../../overlays/ing-external.yaml
  target:
    kind: Ingress
    labelSelector: type=external
- path: ../../overlays/ing-local.yaml
  target:
    kind: Ingress
    labelSelector: type=local
transformers:
- ../../global/ingress-domain-transformer-secret.yaml
