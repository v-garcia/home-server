apiVersion: apps/v1
kind: Deployment
metadata:
  name: samba
spec:
  replicas: 1
  selector:
    matchLabels:
      app: samba
  template:
    metadata:
      labels:
        app: samba
    spec:
      containers:
        - name: samba
          image: localhost:32000/samba
          env:
            - name: USER
              valueFrom:
                secretKeyRef:
                  name: samba-secret
                  key: username
            - name: PASS
              valueFrom:
                secretKeyRef:
                  name: samba-secret
                  key: password
            - name: UID
              value: "1000"
            - name: GID
              value: "0"
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 200m
              memory: 500Mi
          livenessProbe:
            tcpSocket:
              port: 445
            initialDelaySeconds: 30
          readinessProbe:
            tcpSocket:
              port: 445
          ports:
            - containerPort: 139
              protocol: TCP
            - containerPort: 445
              protocol: TCP
          #   # NMBD
          #   - containerPort: 137
          #     protocol: UDP
          #   - containerPort: 138
          #     protocol: UDP
          volumeMounts:
            - name: samba-config
              subPath: smb.conf
              mountPath: /etc/samba/smb.conf
            - name: sabnzbd
              subPath: downloads
              mountPath: /downloads/sabnzbd
            - name: aria2
              subPath: downloads
              mountPath: /downloads/aria2
            - name: perso
              mountPath: /perso
            - name: public
              mountPath: /public
            - name: sabnzbd
              subPath: watchdir
              mountPath: /downloads/watchdir/nzb
            - name: aria2
              subPath: watchdir
              mountPath: /downloads/watchdir/aria2
      volumes:
        - name: samba-config
          configMap:
            name: samba-config
        - name: sabnzbd
          persistentVolumeClaim:
            claimName: sabnzbd
        - name: perso
          persistentVolumeClaim:
            claimName: perso
        - name: public
          persistentVolumeClaim:
            claimName: public
        - name: aria2
          persistentVolumeClaim:
            claimName: aria2
