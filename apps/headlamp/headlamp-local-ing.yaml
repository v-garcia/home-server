apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp-local
  annotations:
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Authorization "Bearer {{BEARER}}";
  labels:
    type: local
spec:
  rules:
    - host: headlamp.local
      http:
        paths:
          - backend:
              service:
                name: headlamp
                port:
                  number: 80
            path: /
            pathType: Prefix
