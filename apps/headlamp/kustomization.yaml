apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - headlamp-sa.yaml
  - headlamp-clusterrolebinding.yaml
  - headlamp-token-secret.yaml
  - headlamp-deploy.yaml
  - headlamp-svc.yaml
  - headlamp-ext-ing.yaml
  - headlamp-local-ing.yaml
patches:
  - path: ../../overlays/ing-external.yaml
    target:
      kind: Ingress
      labelSelector: type=external
  - path: ../../overlays/ing-local.yaml
    target:
      kind: Ingress
      labelSelector: type=local
  - path: ../../overlays/ing-authentified.yaml
    target:
      kind: Ingress
      labelSelector: authentified
transformers:
  - ../../global/ingress-domain-transformer-secret.yaml
