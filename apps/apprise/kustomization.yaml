apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - apprise-cm.yaml
  - apprise-secret.yaml
  - apprise-deploy.yaml
  - apprise-svc.yaml
patches:
- path: ../../overlays/ing-external.yaml
  target:
    kind: Ingress
    labelSelector: type=external
- path: ../../overlays/ing-local.yaml
  target:
    kind: Ingress
    labelSelector: type=local
transformers:
- ../../global/ingress-domain-transformer-secret.yaml
