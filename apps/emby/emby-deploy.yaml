apiVersion: apps/v1
kind: Deployment
metadata:
  name: emby
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emby
  template:
    metadata:
      labels:
        app: emby
    spec:
      containers:
        - name: emby
          image: localhost:32000/emby
          ports:
            - containerPort: 8096
          volumeMounts:
            - name: public
              subPath: videos
              mountPath: /media/public
            - name: emby
              subPath: config
              mountPath: /config
            - name: aria2
              subPath: downloads
              mountPath: /media/aria2
            - name: rqbit
              subPath: downloads
              mountPath: /media/rqbit
          env:
            - name: UID
              value: "0"
            - name: GID
              value: "0"
      volumes:
        - name: public
          persistentVolumeClaim:
            claimName: public
        - name: emby
          persistentVolumeClaim:
            claimName: emby
        - name: aria2
          persistentVolumeClaim:
            claimName: aria2
        - name: rqbit
          persistentVolumeClaim:
            claimName: rqbit
