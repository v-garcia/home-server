apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- rqbit-cm.yaml
- rqbit-ext-ing.yaml
- rqbit-local-ing.yaml
- rqbit-peer-svc.yaml
- rqbit-pv.yaml
- rqbit-pvc.yaml
- rqbit-sts.yaml
- rqbit-svc.yaml
patches:
- path: ../../overlays/ing-authentified.yaml
  target:
    kind: Ingress
    labelSelector: authentified
- path: ../../overlays/ing-external.yaml
  target:
    kind: Ingress
    labelSelector: type=external
- path: ../../overlays/ing-local.yaml
  target:
    kind: Ingress
    labelSelector: type=local
transformers:
- ../../global/ingress-domain-transformer-secret.yaml
